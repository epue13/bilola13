<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX CORE // Mobile Finder Control Center</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --accent: #00ffcc;
            --danger: #ff3366;
            --warning: #ffaa00;
            --text: #e6edf3;
            --text-dim: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', monospace, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { font-size: 24px; letter-spacing: 2px; color: var(--accent); }
        .badge { background: #1f293d; padding: 5px 12px; border-radius: 20px; font-size: 14px; border: 1px solid var(--accent); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #2d3748;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card h2 { font-size: 18px; margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 10px; }

        .stat-box {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
            padding: 20px 0;
        }

        ul { list-style: none; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #0d1117;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid var(--text-dim);
        }

        li.online { border-left-color: var(--accent); }
        li.hopping { border-left-color: var(--warning); }
        li.dead { border-left-color: var(--danger); opacity: 0.6; }

        .bot-name { font-weight: bold; }
        .bot-status { font-size: 12px; padding: 3px 8px; border-radius: 4px; background: #21262d; }

        .status-active { color: var(--accent); }
        .status-hopping { color: var(--warning); }
        .status-offline { color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1>⚡ VEX CORE // MOBILE FINDER</h1>
        <div class="badge">REDE OPERACIONAL</div>
    </header>

    <div class="grid">
        <!-- Card 1: Fila de Job IDs -->
        <div class="card">
            <h2>ESTOQUE DE JOB IDS</h2>
            <div class="stat-box" id="queueCount">0</div>
            <p style="text-align: center; color: var(--text-dim); font-size: 13px;">Servidores pronto para consumo nos Emuladores</p>
        </div>

        <!-- Card 2: Drones/Bots Ativos -->
        <div class="card" style="grid-column: span 2;">
            <h2>DRONES EMULADORES ATIVOS</h2>
            <ul id="botList">
                <li><span class="bot-name">Aguardando pings...</span></li>
            </ul>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                // Atualiza Fila
                document.getElementById('queueCount').innerText = data.queueSize;

                // Atualiza Lista de Bots
                const list = document.getElementById('botList');
                list.innerHTML = '';

                const now = Date.now();
                const bots = data.bots;

                if (Object.keys(bots).length === 0) {
                    list.innerHTML = '<li><span class="bot-name">Nenhum bot conectado no momento.</span></li>';
                    return;
                }

                for (const [name, info] of Object.entries(bots)) {
                    const diffSec = Math.floor((now - info.lastPing) / 1000);
                    let stateClass = 'online';
                    let statusText = info.status;

                    if (diffSec > 25) {
                        stateClass = 'dead';
                        statusText = 'CRASHED / DESCONECTADO (' + diffSec + 's atrás)';
                    } else if (info.status.includes('Hoppar')) {
                        stateClass = 'hopping';
                    }

                    const li = document.createElement('li');
                    li.className = stateClass;
                    li.innerHTML = `
                        <div>
                            <span class="bot-name">${name}</span>
                            <span style="font-size: 11px; color: var(--text-dim); margin-left: 10px;">Ping: ${diffSec}s atrás</span>
                        </div>
                        <span class="bot-status ${stateClass === 'online' ? 'status-active' : (stateClass === 'hopping' ? 'status-hopping' : 'status-offline')}">${statusText}</span>
                    `;
                    list.appendChild(li);
                }
            } catch (err) {
                console.error("Erro ao puxar dados da API:", err);
            }
        }

        setInterval(fetchStatus, 3000);
        fetchStatus();
    </script>
</body>
</html>
